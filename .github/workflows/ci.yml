name: AI Platform CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./third_party/acos_ai_contracts
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Black
        run: black --check app tests

      - name: Pytest
        run: pytest -q
